        - 'packages/core/src/utils/routeHealth.test.ts'
      summary: 'Selected prototype nodes render surface details, export summaries report live routes and surfaces separately, and route-health ignores prototype surfaces for route issue totals.'
      commands:
        - cmd: 'pnpm --filter @neonwatty/nav-map test -- src/workflowManifest.test.ts src/components/panels/ConnectionPanel.test.tsx src/components/panels/ExportButton.test.tsx src/utils/routeHealth.test.ts'
          status: pass
          evidence: 'Core focused prototype-surface test sweep passed; 39 test files and 230 tests passed.'
      evidence:
        - 'Focused tests cover selected surface metadata rendering, export summary counts, and route-health surface exclusion.'
  - id: T005
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: low
    objective: 'Document prototype surfaces and add demo fixture examples without app-specific core behavior.'
    allowed_files:
      - 'README.md'
      - 'packages/demo/public/prcard.workflow.json'
      - 'packages/demo/public/prcard.nav-map.json'
    verify:
      - 'node packages/scanner/dist/cli.js workflow packages/demo/public/prcard.workflow.json -o packages/demo/public/prcard.nav-map.json --no-screenshots'
    stop_if:
      - 'Demo behavior requires core PRcard branches.'
    receipt:
      result: done
      changed_files:
