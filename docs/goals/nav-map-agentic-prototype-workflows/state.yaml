        - 'packages/demo/public/prcard.workflow.json'
        - 'packages/demo/public/prcard.nav-map.json'
      summary: 'README documents surfaces with examples and scanner behavior. PRcard demo manifest and generated graph include generated-image and component prototype surfaces as manifest data.'
      commands:
        - cmd: 'node packages/scanner/dist/cli.js workflow packages/demo/public/prcard.workflow.json -o packages/demo/public/prcard.nav-map.json --no-screenshots'
          status: pass
