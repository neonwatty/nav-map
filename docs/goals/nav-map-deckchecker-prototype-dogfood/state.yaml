version: 2

goal:
  title: 'Nav Map Deckchecker Prototype Dogfood'
  slug: 'nav-map-deckchecker-prototype-dogfood'
  kind: existing_plan
  tranche: 'Dogfood prototype surfaces in the Deckchecker speaker workflow.'
  status: done
  oracle:
    signal: 'Deckchecker speaker workflow includes searchable/selectable prototype surfaces without route validation warnings.'
    cadence: 'after local Git cleanup, manifest update, fixture generation, browser dogfood, and validation'
    final_proof: 'Generated graph and inspect contract include two prototype surfaces; demo UI renders Surface Details for both; focused tests and validation pass.'
  intake:
    original_request: 'Do the recommended next steps after the prototype-surfaces merge.'
    interpreted_outcome: 'Clean up local Git state and use prototype surfaces in a second realistic workflow.'
    input_shape: existing_plan
    audience: 'nav-map maintainers and future workflow manifest authors'
