  - 'Stale prototype branch from PR 145 is removed locally and remotely.'
  - 'Deckchecker manifest includes html-mockup and keyframe prototype surfaces.'
  - 'Generated Deckchecker nav-map fixture includes prototype:// surface routes.'
  - 'Speaker deck workflow includes the prototype surface steps.'
  - 'Inspect contract separates live nodes and surfaces.'
  - 'Demo UI can select both surfaces and render Surface Details without validation warnings.'
  - 'Focused tests and validation pass.'

