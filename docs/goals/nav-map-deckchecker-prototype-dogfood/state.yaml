    blind_spots_considered:
      - 'Deckchecker auth storage path appears in the manifest, but storage contents must not be inspected.'
      - 'Synthetic prototype routes must not create validation warnings.'
      - 'Generated fixture must be refreshed after manifest edits.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: none
  local:
    status: not_started
    url: null
    command: 'npx goalbuddy board docs/goals/nav-map-deckchecker-prototype-dogfood'

active_task: null

acceptance_criteria:
