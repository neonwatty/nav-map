# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Nav Map Preview Readiness UX Cleanup"
  slug: "nav-map-preview-readiness-ux-cleanup"
  kind: existing_plan
  tranche: "Implement the three-agent audit recommendations for clearer screenshot/mockup/prototype/app preview UX, target readiness semantics, responsive manual-QA controls, and agent-oriented CLI/context output."
  status: done
  oracle:
    signal: "Fresh Codex Chrome walkthroughs of PRcard, Deckchecker, and Bleep plus CLI/context receipts prove that artifact type, current preview, target preflight, and route/workflow audit are distinct and usable for manual QA."
    cadence: "after each Worker package and at final audit"
    final_proof: "Passing focused tests/typecheck/build plus Chrome walkthroughs at desktop and 858px width covering PRcard app/prototype/mockup nodes, Deckchecker external app targets, Bleep raw scan overview, preview toggles, selected node details, search/audit/animation sanity, and CLI/context output including surfaces."
  intake:
    original_request: "Create a GoalBuddy prep board from the three-agent CLI and Chrome UX audit for screenshot, mockup, and app versions."
    interpreted_outcome: "nav-map becomes straightforward for agents and humans to use for manual QA across saved screenshots, HTML mockups, static prototypes, and live app routes."
    input_shape: existing_plan
    audience: "agents and humans performing manual QA with nav-map"
    authority: requested
    proof_type: demo
    completion_proof: "Focused tests plus fresh Chrome and CLI receipts proving the simplified UX end to end."
    likely_misfire: "Shipping cosmetic wording changes while the app still reports screenshot views as Live, opaque external targets as Ready, static prototypes with duplicate Static badges, or raw scans as empty workflow atlases."
    blind_spots_considered:
      - "Browser no-cors reachability does not prove iframe embeddability or app render correctness."
      - "Route health and target preflight are separate concepts but currently compete visually."
      - "CLI commands are capable but fragmented; agent users need a first-class workflow and receipts."
      - "Cross-dataset persisted UI state can make a valid graph look broken or stale."
      - "Responsive toolbar behavior matters because manual QA often happens with side panels open."
    existing_plan_facts:
      - "Three independent agents audited the app in Codex Chrome and inspected the codebase."
      - "All agents converged on overloaded Live/Screenshot vocabulary."
      - "Two agents observed external targets being reported as ready despite iframe uncertainty."
      - "Two agents observed toolbar overflow around 858px width with panels open."
      - "One agent found nav-map context omits prototype/mockup surfaces."
      - "One agent found workflow screenshot receipts are too thin for agent operation."
      - "One agent found raw scans show zero-value workflow counters under a Workflow heading."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/nav-map-preview-readiness-ux-cleanup/"
    command: "npx goalbuddy board docs/goals/nav-map-preview-readiness-ux-cleanup"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the three-agent audit and lock the first implementation sequence, allowed files, verification commands, and stop conditions."
    inputs:
      - "Three-agent audit receipts from the current thread."
      - "Goal oracle in docs/goals/nav-map-preview-readiness-ux-cleanup/goal.md."
      - "Current repo state on main."
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Do not inspect secrets, auth storage, env values, cookies, tokens, localStorage, sessionStorage, or browser profile data."
      - "Preserve the four-axis UX model: artifact type, current preview, target preflight, route/workflow audit."
      - "Prefer the largest safe useful Worker slice; avoid one tiny task per label."
    expected_output:
      - "Decision: approve, revise, or block the proposed sequence."
      - "First Worker objective."
      - "Allowed files."
      - "Verification commands and required Chrome workflows."
      - "Stop conditions."
      - "Deferred tasks or scope cuts."
    receipt:
      result: done
      task_id: T001
      decision: approved
      full_outcome_complete: false
      rationale: "Approve the sequence and T002 as first Worker. Current code validates the audit: UI conflates artifact/status/readiness, opaque no-cors probes become Ready, context omits surfaces, demo silently falls back on bad dataset keys, and state persists across datasets. T002 is the right dependency-first vertical slice because T003-T005 rely on the four-axis language and readiness model being corrected first."
      evidence:
        - "state.yaml defines T002-T005 with objective, allowed_files, verify commands, and stop_if."
        - "packages/core/src/components/panels/ConnectionPanel.tsx shows Preview Status as artifact/status and Live Status/Target Health together."
        - "packages/core/src/components/nodes/PageNode.tsx stacks artifact, preview status, and readiness badges, allowing duplicate Static labels."
        - "packages/core/src/hooks/useLiveReadiness.ts treats opaque no-cors responses as reachable and labels reachable as Ready."
        - "packages/scanner/src/modes/context.ts builds routes from manifest.nodes only, not manifest.surfaces."
        - "packages/demo/app/page.tsx falls back invalid dataset keys to prcard and persists view mode globally."
      parallel_safety:
        safe_parallel_workers: false
        reason: "T002 and T003 both touch NavMap/toolbar semantics, T002 and T004 both touch README/model language, and T005 depends on post-cleanup labels; run sequentially."
      required_board_updates:
        - "Activate T002 unchanged as the first Worker."
        - "Keep T003, T004, T005 queued in the current order."
        - "Do not mark full outcome complete until T999 maps fresh tests, CLI receipts, and Chrome walkthroughs to the oracle."

