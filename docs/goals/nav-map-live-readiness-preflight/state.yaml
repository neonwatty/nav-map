# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Nav Map Live Readiness Preflight"
  slug: "nav-map-live-readiness-preflight"
  kind: specific
  tranche: "Complete the first reusable Live readiness UX slice: preflight, summary, per-node state, fallback rendering, tests, docs, and Chrome dogfood."
  status: done
  oracle:
    signal: "Fresh Codex Chrome walkthrough of http://localhost:3001/?dataset=prcard proves Live readiness preflight, global summary, per-node statuses, reachable app/mockup live views, offline fallback, screenshot fallback, and no fresh browser warning/error logs."
    cadence: "after each Worker package and at final audit"
    final_proof: "Passing focused tests/typecheck/build plus recorded Chrome workflows against reachable and intentionally offline targets."
  intake:
    original_request: "Plan with GoalBuddy prep how to improve Live option UX with preflight checks and global/per-node unavailable notices."
    interpreted_outcome: "Users can switch to Live mode and immediately understand which nodes are ready, offline, blocked, static-only, or still checking before broken live previews appear."
    input_shape: specific
    audience: "nav-map users reviewing workflow atlases across app routes, mockups, and prototype surfaces"
    authority: requested
    proof_type: test
    completion_proof: "Focused automated tests plus Chrome dogfood workflows proving the Live readiness UX end to end."
    likely_misfire: "Treating Live as successful when only the selected iframe URL exists, while offline app targets, static prototypes, blocked auth states, or crashed iframes remain unclear."
    blind_spots_considered:
      - "Browser probes can reliably detect network refusal but cannot always prove cross-origin HTTP status or route render correctness."
      - "App routes may require looser iframe sandboxing than mockups."
      - "Preflight should avoid making Live mode feel slow or noisy on large graphs."
      - "The current screenshots fallback must remain useful, not replaced by blank live failures."
    existing_plan_facts:
      - "When the user clicks Live, nav-map should check the desired app URL and node targets before showing live views."
      - "The UX should show global unavailability and individual node unavailability."
      - "Preflight should support app routes, mockups, static prototypes, blocked states, and offline targets."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/nav-map-live-readiness-preflight/"
    command: "npx goalbuddy board docs/goals/nav-map-live-readiness-preflight"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the current Live-mode data flow, selected-node probe behavior, preview toggle state, node rendering, and tests without editing implementation files."
    inputs:
      - "README.md"
      - "packages/core/src/components/NavMap.tsx"
      - "packages/core/src/components/panels/PreviewModeToggle.tsx"
      - "packages/core/src/components/panels/ConnectionPanel.tsx"
      - "packages/core/src/components/nodes/PageNode.tsx"
      - "packages/core/src/utils/artifactPreview.ts"
      - "packages/core/src/hooks/useNavMap.ts"
      - "packages/core/src/hooks/useNavMapDerivedGraph.ts"
      - "packages/core/src/hooks/useViewModeLayoutBuilders.ts"
      - "packages/demo/public/prcard.workflow.json"
      - "Existing focused tests for preview mode, nodes, and ConnectionPanel"
    constraints:
      - "Read-only."
      - "Do not inspect secrets, env files, auth storage, cookies, localStorage, or session storage."
      - "Do not edit implementation files."
      - "Preserve existing route behavior and app-specific data boundaries."
    expected_output:
      - "Current Live-mode flow map"
      - "Where selected-node-only probing lives today"
      - "Existing tests to extend"
      - "Smallest reusable readiness model proposal"
      - "Implementation risks and verification commands"
    receipt:
      result: done
      summary: "Live mode is currently global state, but target probing is selected-node-only in ConnectionPanel; node cards and toolbar know availability labels but not target health. The smallest reusable model is graph-scoped live readiness derived from getNodePreviewState plus per-node probe status, exposed through context to toolbar, PageNode, and ConnectionPanel."
      evidence:
        - "packages/core/src/components/NavMap.tsx: previewMode, liveBaseUrlOverride, liveUrlOverrides are persisted and passed through NavMapShell context."
        - "packages/core/src/components/panels/PreviewModeToggle.tsx: Live click only changes previewMode; it does not preflight targets."
        - "packages/core/src/components/panels/ConnectionPanel.tsx: useLiveTargetProbe currently checks only previewState.liveUrl for the selected panel node."
        - "packages/core/src/components/nodes/PageNode.tsx: node tabs show artifact kind and declared Live/Static/Blocked state, but no reachable/offline/checking target health."
        - "packages/core/src/utils/artifactPreview.ts: getNodePreviewState already centralizes app/mockup/prototype classification, URL source, static, blocked, and live availability."
        - "packages/core/src/hooks/useViewModeLayoutBuilders.ts: flow occurrence nodes preserve graph node ids through nodeId, so readiness can key by graph node id and work across repeated flow nodes."
        - "packages/core/src/components/NavMap.test.tsx, ConnectionPanel.test.tsx, PageNode.test.tsx, artifactPreview.test.ts: existing focused tests cover preview toggle persistence, selected panel live/offline behavior, node tabs, and preview-state derivation."
      proposal:
        model:
          - "NavMapLiveReadinessStatus: idle | checking | reachable | offline | static | blocked | unavailable"
          - "NavMapLiveReadinessByNode: node id -> { status, artifactKind, liveUrl, liveUrlSource, message }"
          - "NavMapLiveReadinessSummary: total, checking, reachable, offline, static, blocked, unavailable"
          - "Probe scope defaults to the current flow when in flow mode with a selected flow, otherwise all graph nodes."
        implementation_points:
          - "Move browser target probing into a reusable hook near NavMap state, not ConnectionPanel."
          - "Use getNodePreviewState for every scoped node, then probe only available iframe targets with liveUrl."
          - "Expose readiness map and summary through NavMapContext."
          - "Toolbar renders compact Live readiness summary near the Live toggle."
          - "PageNode renders target-health tab in Live mode."
          - "ConnectionPanel consumes readiness instead of running its own selected-node probe."
      risks:
        - "Browser fetch with no-cors proves network reachability but not cross-origin HTTP status or full render correctness."
        - "Probing every graph node on very large maps may be noisy; scope should prefer current flow and use bounded concurrency or simple effect cancellation."
        - "Static/prototype and blocked/auth states should not be treated as failures."
      verify:
        - "pnpm --filter @neonwatty/nav-map test -- src/utils/artifactPreview.test.ts src/components/panels/ConnectionPanel.test.tsx src/components/nodes/PageNode.test.tsx src/components/NavMap.test.tsx"
        - "pnpm --filter @neonwatty/nav-map typecheck"
        - "pnpm --filter @neonwatty/nav-map build"

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Choose the smallest reusable Live readiness model and the first safe Worker package."
    inputs:
      - "T001 receipt"
      - "Goal oracle"
      - "Current dirty diff"
    constraints:
      - "Do not implement."
      - "Prefer one coherent vertical slice over tiny helper-only tasks."
      - "Keep PRcard-specific assumptions out of nav-map core."
      - "Account for cross-origin probe limitations honestly."
    expected_output:
      - "Decision"
      - "Readiness model fields and status vocabulary"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify commands"
      - "stop_if conditions"
      - "Deferred follow-up candidates"
    receipt:
      result: done
      decision: "Proceed with one reusable, flow-scoped Live readiness preflight slice. The model should live in nav-map core, derive node capability from the existing artifact preview helpers, probe only iframe-capable live URLs, and expose readiness through context so toolbar, nodes, and selected-panel UX all agree."
      approved_model:
        statuses:
          - "idle: Live mode is not active or no check has started."
          - "checking: an iframe-capable live URL is being probed."
          - "reachable: the browser can reach the live URL well enough to attempt an iframe."
          - "offline: the browser probe failed or timed out."
          - "static: the node is intentionally screenshot/prototype/static-only."
          - "blocked: the node declares auth, permissions, or another reason Live cannot be used."
          - "unavailable: no live URL or iframe-capable target is available."
        readiness_record:
          - "nodeId"
          - "status"
          - "artifactKind"
          - "liveUrl, when safe and available"
          - "liveUrlSource, when known"
          - "message for compact UX copy"
        summary_record:
          - "scope: current-flow or graph"
          - "total, checking, reachable, offline, static, blocked, unavailable"
        scope_rule: "When the user is in flow view with a selected flow, preflight unique graph nodes in that flow plus the selected node if it is outside the flow. Otherwise preflight all graph nodes."
      worker_package:
        objective: "Ship the first user-visible Live readiness slice: reusable readiness model/hook, global Live summary, per-node readiness tab, selected-panel readiness/fallback behavior, focused tests, and no PRcard-specific core logic."
        acceptance_criteria:
          - "Switching to Live starts a preflight for the current flow or graph without requiring the user to click each node."
          - "The toolbar shows a compact global readiness summary while checking and after results settle."
          - "Each node in Live mode shows a border/tab status indicating reachable, offline, static, blocked, checking, or unavailable."
          - "The selected-node panel uses the same readiness state as the node and toolbar, with no separate selected-only probe."
          - "Reachable app URLs and reachable mockup URLs still render in iframes with the existing app/mockup sandbox behavior."
          - "Offline or unavailable live targets do not show a broken blank iframe; screenshots remain usable with a clear Live-unavailable notice."
          - "Prototype/static and blocked nodes are described as intentional non-live states, not as failures."
          - "The implementation does not hard-code PRcard, Deckchecker, localhost ports, or app-specific workflow behavior into nav-map core."
          - "Focused tests cover preview state derivation, toolbar/Live summary, selected-panel offline fallback, and node readiness labels."
      deferred:
        - "Backend or service-worker grade route checks that can prove HTTP status and page render correctness across origins."
        - "Large-graph probe concurrency controls beyond simple cancellation and current-flow scoping."
        - "Auth-aware Live sessions or credentialed checks."
        - "Per-node manual retry controls, unless they become necessary during dogfood."
      limitations:
        - "Browser no-cors fetch can establish practical reachability, but it cannot always prove exact cross-origin HTTP status."
        - "Iframe reachability is separate from whether the app page itself renders meaningful content."

