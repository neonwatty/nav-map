          - "pnpm --filter @neonwatty/nav-map exec vitest run src/components/panels/ConnectionPanel.test.tsx"
          - "pnpm --filter @neonwatty/nav-map exec vitest run src/components/nodes/PageNode.test.tsx"
          - "pnpm --filter @neonwatty/nav-map exec vitest run src/components/NavMap.test.tsx"
