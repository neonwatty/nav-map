      - 'Graph or gallery surface contains Bleep nodes.'
      - 'Preview toggle changes aria-pressed state for Screenshots and Live.'
      - 'console error/warning count is 0.'

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: 'Reproduce and localize the duplicate key warning plus current preview-mode UX behavior before editing.'
    inputs:
      - 'Fresh local app instance'
      - 'Codex Chrome-controlled PRcard workflow'
      - 'Current tests and component structure'
    allowed_files:
      - 'packages/core/src/**'
      - 'packages/demo/app/**'
      - 'packages/demo/public/prcard*.json'
      - 'README.md'
      - 'docs/**'
    verify:
      - 'Open fresh Chrome tab at http://localhost:3001/?dataset=prcard.'
      - 'Select Protected-route redirects and record duplicate-key reproduction status.'
      - 'Select GitHub-connected creator and record current live mockup/static prototype behavior.'
    stop_if:
      - 'Need to inspect secrets, cookies, tokens, env values, OAuth secrets, private keys, service-role keys, or Playwright auth storage.'
    expected_output:
      - 'Suspected files/functions for repeated-node keying.'
      - 'Current UX gaps for preview mode and artifact-kind labels.'
      - 'Recommended Worker slice with allowed files and focused tests.'
    receipt:
      result: done
      summary: 'Reproduced the duplicate key warning by loading PRcard, selecting Protected-route redirects, and observing repeated React console errors for key quick-setup. Localized likely source to flow layout rendering because buildFlowLayoutInput emits React Flow nodes with id equal to the graph step id even when a flow revisits the same node.'
      evidence:
        - 'Fresh Chrome tab at http://localhost:3001/?dataset=prcard returned NavMap Demo and selected PRcard workflow.'
        - 'Selecting Protected-route redirects produced repeated console errors: duplicate key quick-setup.'
        - 'The PRcard manifest flow steps are quick-setup, signup, creator, quick-setup.'
        - 'packages/core/src/hooks/useViewModeLayoutBuilders.ts currently maps flow steps to React Flow nodes with id: stepId.'
        - 'GitHub-connected creator currently shows per-node Prototype/Static and Mockup/Live labels; Live iframe appears for Quick Setup HTML Mockup.'
      limitations:
        - 'The preview concept click was noisy because prior selected-node state persisted during the Scout pass; final dogfood must use fresh tabs after the fix.'

