      - 'Select Speaker deck workflow.'
      - 'Select Speaker auth boundaries.'
      - 'Toggle Screenshots and Live.'
      - 'Verify each selected flow renders.'
      - 'Verify console errors/warnings are empty.'
    measurable_pass:
      - 'Selected dataset text is Deckchecker speaker.'
      - 'Each named flow can be selected and observed as selected.'
      - 'Preview toggle changes aria-pressed state for Screenshots and Live.'
      - 'console error/warning count is 0 after flow and preview interactions.'
  - id: chrome-bleep-app-scan
    name: 'Bleep app scan'
    url: 'http://localhost:3001/?dataset=bleep'
    steps:
      - 'Load Bleep app scan dataset.'
      - 'Toggle Screenshots and Live.'
