version: 2

goal:
  title: 'Nav Map Preview Mode Dogfood Polish'
  slug: 'nav-map-preview-mode-dogfood-polish'
  kind: existing_plan
  tranche: 'Fix duplicate repeated-node warnings and clarify screenshot/live preview UX.'
  status: done
  oracle:
    signal: 'Fresh Codex Chrome dogfood pass proves named workflows render correctly with clear preview semantics and no console errors or warnings.'
    cadence: 'after implementation, focused tests, local server restart, and fresh browser walkthrough'
    final_proof: 'Focused tests pass, relevant build/check passes, and fresh Chrome receipts cover PRcard, Deckchecker, and Bleep workflows with clean console output.'
  intake:
    original_request: 'Map this out as a detailed GoalBuddy prep board with solid and measurable acceptance criteria.'
    interpreted_outcome: 'Prepare a board to fix duplicate React key warnings and clarify preview-mode UX, with required Chrome dogfood workflows named before implementation.'
    input_shape: existing_plan
    audience: 'nav-map users, manifest authors, and future coding agents'
    authority: approved
    proof_type: demo_plus_test
    completion_proof: 'The local app passes named Chrome dogfood workflows, focused tests, and relevant build/checks without secret inspection.'
    likely_misfire: 'Treating Screenshots/Live as app/mockup/prototype modes, or fixing the React warning while leaving artifact-kind UX ambiguous.'
    blind_spots_considered:
      - 'A node can appear multiple times in a selected flow, so keys must be occurrence-safe without changing graph node identity.'
      - 'Live mode can be globally active while a selected node is static or non-iframe-renderable.'
      - 'Prior console logs can pollute proof, so final dogfood must use fresh tabs or a fresh browser session.'
      - 'Tests can pass while the browser UX remains confusing, so Chrome walkthrough receipts are mandatory.'
    existing_plan_facts:
      - 'Current visible global control is Screenshots versus Live.'
      - 'Per-node artifact labels currently include App, Mockup, Prototype and live/static states.'
      - 'PRcard GitHub-connected creator contains the Quick Setup HTML Mockup live iframe path.'
      - 'PRcard Protected-route redirects previously produced duplicate key warnings for quick-setup during dogfooding.'

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: running
    url: 'http://goalbuddy.localhost:41737/nav-map-preview-mode-dogfood-polish/'
    command: 'npx goalbuddy board docs/goals/nav-map-preview-mode-dogfood-polish'

active_task: null

acceptance_criteria:
  - 'Current PRcard Protected-route redirects duplicate key warning is reproduced and documented before implementation.'
  - 'Repeated node or route appearances render with occurrence-safe React keys without changing graph node ids.'
  - 'Chrome console contains zero duplicate-key warnings after selecting PRcard Protected-route redirects.'
  - 'Global preview control is clearly presented as render mode: Screenshots versus Live.'
  - 'UI does not imply a global App/Mockup/Prototype mode switch.'
  - 'Per-node labels clearly distinguish App / Live, Mockup / Live, Prototype / Static, and blocked/unavailable live states when present.'
  - 'Static prototype selection explains that no live preview is available and renders no iframe.'
  - 'PRcard Quick Setup HTML Mockup in Live mode renders exactly one iframe with /mockups/prcard-quick-setup.html.'
  - 'PRcard Quick Setup HTML Mockup in Screenshots mode renders no live iframe.'
  - 'App-route nodes remain visible and usable in Live mode; renderable App / Live nodes may show a live iframe, while static or blocked nodes do not show misleading iframe UI.'
  - 'Focused tests cover repeated-node rendering, preview toggle behavior, live mockup iframe behavior, and static prototype messaging.'
  - 'Docs or demo guidance explain global preview render mode versus per-node artifact kind.'
  - 'Relevant package build/check passes.'
  - 'Final receipt names all required Chrome dogfood workflows and records selected flow, preview toggle state, console status, iframe status, and limitations.'

required_chrome_workflows:
  - id: chrome-prcard-signed-out-activation
    name: 'PRcard: Signed-out activation'
    url: 'http://localhost:3001/?dataset=prcard'
    steps:
      - 'Select flow Signed-out activation.'
      - 'Toggle Screenshots then Live.'
      - 'Verify app nodes remain visible.'
      - 'Verify renderable App / Live nodes can show a live iframe from the configured app base URL.'
      - 'Verify console errors/warnings are empty.'
    measurable_pass:
      - 'Selected dataset text is PRcard workflow.'
      - 'Selected flow text is Signed-out activation.'
      - 'Live button aria-pressed is true after toggle.'
      - 'selected App / Live node either renders the configured app live URL or clearly reports a blocked/unavailable live state.'
      - 'console error/warning count is 0.'
  - id: chrome-prcard-github-connected-creator
    name: 'PRcard: GitHub-connected creator'
    url: 'http://localhost:3001/?dataset=prcard'
    steps:
      - 'Select flow GitHub-connected creator.'
      - 'Select Quick Setup Concept.'
      - 'Verify static prototype language and no iframe.'
      - 'Select Quick Setup HTML Mockup.'
      - 'Verify Mockup / Live language and exactly one iframe for /mockups/prcard-quick-setup.html.'
      - 'Verify iframe content renders.'
      - 'Toggle Screenshots.'
      - 'Verify live iframe is removed or replaced by static preview behavior.'
      - 'Verify console errors/warnings are empty.'
    measurable_pass:
      - 'Quick Setup Concept details include Prototype and Static/no-live language.'
      - 'Quick Setup Concept iframe count is 0.'
      - 'Quick Setup HTML Mockup details include Mockup and Live language.'
      - 'Quick Setup HTML Mockup iframe count is 1 in Live mode.'
      - 'iframe src equals /mockups/prcard-quick-setup.html.'
      - 'iframe body exposes the PRcard quick setup mockup main landmark or equivalent visible content.'
      - 'Quick Setup HTML Mockup iframe count is 0 after toggling Screenshots.'
      - 'console error/warning count is 0.'
  - id: chrome-prcard-protected-route-redirects
    name: 'PRcard: Protected-route redirects'
    url: 'http://localhost:3001/?dataset=prcard'
    steps:
      - 'Select flow Protected-route redirects.'
      - 'Verify repeated quick-setup appearances do not produce duplicate key warnings.'
      - 'Verify flow remains visually usable.'
      - 'Verify console errors/warnings are empty.'
    measurable_pass:
      - 'Selected flow text is Protected-route redirects.'
      - 'Console contains no duplicate key warning for quick-setup.'
      - 'Console error/warning count is 0.'
      - 'Visible flow includes Quick Setup and related redirect nodes.'
