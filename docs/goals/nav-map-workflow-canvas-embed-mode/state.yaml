version: 2

goal:
  title: "NavMap Workflow Canvas Embed Mode"
  slug: "nav-map-workflow-canvas-embed-mode"
  kind: existing_plan
  tranche: "Freeze the shared canvas contract, then build and prove a focused reusable WorkflowCanvas without Agent Workflows lifecycle inference."
  status: active
  oracle:
    signal: "A standalone focused WorkflowCanvas renders the frozen workflow-canvas/v1 fixture accessibly at desktop and 393x852 with truthful screenshot nodes, supplied run overlays, findings/annotations, focused details, and comparisons while unrelated NavMap controls remain absent."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipt-backed component, semantic fallback, accessibility, responsive, reduced-motion, fixture, package-consumer, full validation, and independent final Judge proof mapped to all charter checks."
  intake:
    original_request: "Perform a focused NavMap workflow-canvas track in parallel with the Studio decision-model and journey-evidence track."
    interpreted_outcome: "NavMap offers a constrained reusable workflow-review canvas that consumes but never invents Agent Workflows truth."
    input_shape: existing_plan
    audience: "Product teams embedding screenshot-backed workflow review, initially Agent Workflows Studio"
    authority: approved
    proof_type: demo
    completion_proof: "The public focused component passes fixture, interaction, responsive, accessibility, reduced-motion, package-consumer, full validation, and final adversarial proof."
    likely_misfire: "Repackage the complete NavMap viewer, hide complexity with brittle CSS, or hardcode Agent Workflows lifecycle semantics."
    blind_spots_considered:
      - "React and layout runtime weight"
      - "Public exports versus private internal composition"
      - "Producer-consumer contract drift"
      - "Generic presentation versus product-specific lifecycle inference"
      - "Reference, observed, resolution, unavailable, stale, and corrupt evidence"
      - "Annotation provenance and immutable screenshot bytes"
      - "Mobile canvas gestures, panel density, and page overflow"
      - "Keyboard graph traversal, focus return, dialogs, and screen-reader fallback"
      - "Reduced motion and decorative animation"
      - "Larger graph performance and semantic zoom"
      - "Privacy-safe fixtures and package delivery"
    existing_plan_facts:
      - "Run consumer and producer Scouts in parallel before contract freeze."
      - "Workflows owns lifecycle meaning and the canonical producer contract after rendezvous."
      - "NavMap renders supplied truth and never derives pass, qualification, integrity, readiness, or canonical eligibility."
      - "Expose a focused public WorkflowCanvas API rather than private component imports or the full viewer."
      - "Default to Flow view and hide unrelated search, live-target, analytics, export, route-health, and site-map controls."
      - "Support screenshot nodes, focused details, supplied status/findings/annotations, semantic fallback, and comparison."
      - "Prove desktop, exactly 393x852 mobile, keyboard, screen readers, reduced motion, and package consumption."
      - "Stop before production Agent Workflows integration or package publication."

