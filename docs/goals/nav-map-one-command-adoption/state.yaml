version: 2

goal:
  title: "NavMap One-Command Adoption"
  slug: "nav-map-one-command-adoption"
  kind: existing_plan
  tranche: "Deliver the backward-compatible per-repository init, open, and sync workflow with the complete viewer and browser-verified dogfood proof."
  status: done
  oracle:
    signal: "A clean fixture app and at least three dogfood apps complete init, open, and sync while the complete viewer passes browser verification."
    cadence: "after each Worker package and at final audit"
    final_proof: "Command receipts, focused and full verification, and browser walkthrough evidence mapped to the adoption workflow."
  intake:
    original_request: "Make a plan to make NavMap easier to pick up and use with web apps."
    interpreted_outcome: "A developer can adopt and repeatedly use NavMap from any web-app repository through a one-command-oriented workflow without embedding a custom demo."
    input_shape: existing_plan
    audience: "Developers working across several web apps"
    authority: approved
    proof_type: demo
    completion_proof: "A clean app plus three dogfood apps pass init -> open -> sync browser and compatibility verification."
    likely_misfire: "Improving isolated internals while the convenient path still launches a reduced viewer or requires manual integration."
    blind_spots_considered:
      - "Schema migration and stale generated graph compatibility"
      - "Environment URL portability and stable project identity"
      - "Nested screenshot paths and artifact ownership"
      - "Server lifecycle, port conflicts, and browser readiness"
      - "Backward compatibility for current CLI and React consumers"
    existing_plan_facts:
      - "First milestone is per repository, not the multi-project hub."
      - "Add init, open, and sync orchestration."
      - "Open must use the complete NavMap viewer."
      - "Preserve existing CLI commands and React package behavior."
      - "Verify a fresh app and at least three dogfood apps in a browser."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/nav-map-one-command-adoption/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.0/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/nav-map-one-command-adoption"

