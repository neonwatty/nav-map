<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Golden Checkout Mockup</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f6f7f9;
        color: #17202a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 48px));
        border: 1px solid #d8dee8;
        background: #ffffff;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 16px 48px rgba(20, 30, 48, 0.12);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #526070;
        line-height: 1.5;
      }

      .rows {
        margin-top: 24px;
        display: grid;
        gap: 12px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        border: 1px solid #e5e9f0;
        border-radius: 6px;
        padding: 14px 16px;
      }

      .label {
        font-weight: 650;
      }

      .value {
        color: #2563eb;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Golden Checkout Mockup</h1>
      <p>Static HTML fixture for nav-map agent reliability checks.</p>
      <section class="rows" aria-label="Checkout summary">
        <div class="row">
          <span class="label">Artifact</span>
          <span class="value">HTML mockup</span>
        </div>
        <div class="row">
          <span class="label">Live target</span>
          <span class="value">Local fixture</span>
        </div>
        <div class="row">
          <span class="label">Safety</span>
          <span class="value">No writes</span>
        </div>
      </section>
    </main>
  </body>
</html>
